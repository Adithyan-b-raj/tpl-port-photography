<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-wl-brand>VERA LIGHT // DARKROOM PROOFING VAULT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme-tokens.css">
  <script src="whitelabel.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-main, #0D0C0B);
      color: #EAE6DF;
      font-family: var(--font-primary, 'Plus Jakarta Sans', sans-serif);
      line-height: 1.5;
    }
    .darkroom-header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #262320;
      position: sticky;
      top: 0;
      background: rgba(13,12,11,0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
    }
    .brand-title {
      font-family: var(--font-accent, 'Cormorant Garamond', serif);
      font-size: 24px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #FFF;
    }
    .tray-counter {
      background: var(--color-primary, #D4A373);
      color: #000;
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* Staggered Variable-Aspect Masonry */
    .masonry-wall {
      max-width: 1400px;
      margin: 40px auto 120px;
      padding: 0 40px;
      column-count: 3;
      column-gap: 24px;
    }
    @media (max-width: 900px) { .masonry-wall { column-count: 1; } }

    .photo-card {
      break-inside: avoid;
      background: #161412;
      border: 1px solid #262320;
      margin-bottom: 24px;
      position: relative;
    }
    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: filter 0.3s;
    }
    .photo-card:hover img { filter: contrast(110%); }

    .exif-bar {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: #A8A29E;
      background: #110F0D;
    }
    .heart-btn {
      background: none;
      border: none;
      color: #78716C;
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
    }
    .heart-btn.liked { color: #EF4444; transform: scale(1.2); }

    /* Client Proofing Drawer */
    .proofing-tray {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #161412;
      border-top: 1px solid #262320;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 12px;
    }
  </style>
</head>
<body data-layout-archetype="cinema-darkroom-masonry-proofing">
  <header class="darkroom-header">
    <div class="brand-title" data-wl-brand>VERA LIGHT</div>
    <div style="font-family:var(--font-mono); font-size:12px; color:#A8A29E;">KODAK TRI-X 400 • LEICA M11 MONOCHROM</div>
    <div class="tray-counter" onclick="openProofing()">♥ <span id="likeCount">0</span> SELECTED IN TRAY</div>
  </header>

  <div class="masonry-wall">
    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80" alt="Editorial Portrait">
      <div class="exif-bar">
        <span>35mm · f/1.4 · 1/500s · ISO 100</span>
        <button class="heart-btn" onclick="toggleHeart(this)">♥</button>
      </div>
    </div>
    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="Atmospheric Horizon">
      <div class="exif-bar">
        <span>50mm · f/2.0 · 1/1000s · ISO 200</span>
        <button class="heart-btn" onclick="toggleHeart(this)">♥</button>
      </div>
    </div>
    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80" alt="Studio Shadow">
      <div class="exif-bar">
        <span>85mm · f/1.8 · 1/250s · ISO 100</span>
        <button class="heart-btn" onclick="toggleHeart(this)">♥</button>
      </div>
    </div>
  </div>

  <div class="proofing-tray">
    <div>CLIENT ALBUM PROOFING (PIN: 2026)</div>
    <button style="background:var(--color-primary); border:none; padding:8px 18px; font-weight:700; cursor:pointer;" onclick="openProofing()">APPROVE & EXPORT SELECTIONS</button>
  </div>

  <script>
    let likes = 0;
    function toggleHeart(btn) {
      btn.classList.toggle('liked');
      if (btn.classList.contains('liked')) likes++; else likes--;
      document.getElementById('likeCount').textContent = likes;
    }
    function openProofing() {
      const pin = prompt("Enter 4-Digit Proofing Vault PIN (Demo: 2026):");
      if (pin === "2026") {
        alert("Vault Unlocked! " + likes + " photos selected for print retouches.");
      } else {
        alert("Invalid PIN.");
      }
    }
  </script>
</body>
</html>
